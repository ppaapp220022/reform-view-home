server {
  listen 80;
  server_name _;

  # 사진 업로드 - 기본값 1m이면 휴대폰 사진(2~5MB)이 백엔드에 닿기 전에 413으로 막힌다
  # 백엔드 multipart 한도(파일 10MB, 요청 30MB)와 맞춘다
  client_max_body_size 30m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /oauth2/ {
    proxy_pass http://backend:8080/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /login/oauth2/ {
    proxy_pass http://backend:8080/login/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:8080/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /stomp/ {
    proxy_pass http://backend:8080/stomp/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 빌드 파일은 내용이 바뀌면 이름(해시)도 바뀌므로 오래 캐시한다
  # 없는 파일은 index.html로 돌리지 않고 404 - 예전 index.html이 지워진 번들을 찾으면
  # HTML이 JS로 내려가 MIME 오류로 빈 화면이 되던 문제
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html은 매번 새로 확인 - 배포 뒤에도 브라우저가 예전 번들 주소를 들고 있지 않게
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
